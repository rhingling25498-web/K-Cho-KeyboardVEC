
name: Build K'Cho Keyboard

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Keyman Compiler
        run: npm install --global @keymanapp/kmc

      - name: Find and extract K'Cho ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname 'KCho-Keyboard-Source.zip' \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: KCho-Keyboard-Source.zip not found!"
            exit 1
          fi

          EXTRACT_DIR="$GITHUB_WORKSPACE/.kcho-source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SOURCE_FILE=$(find "$EXTRACT_DIR" \
            -type f \
            -name 'k_cho_keyboard.kmn' \
            -print -quit)

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: Keyboard source file not found!"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SOURCE_FILE")

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Found source: $SOURCE_FILE"

      - name: Compile K'Cho Keyboard
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          kmc build k_cho_keyboard.kmn

          echo "Keyboard compilation completed!"

      - name: Check Build Output
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking compiled files..."

          find "$SOURCE_DIR" -maxdepth 2 \
            -type f \
            \( -name '*.kmx' -o -name '*.js' -o -name '*.kvk' \) \
            -print

          if ! find "$SOURCE_DIR" -maxdepth 2 \
            -type f \
            \( -name '*.kmx' -o -name '*.js' \) \
            | grep -q .; then
            echo "ERROR: No compiled keyboard files found!"
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Keyboard-Build
          path: |
            ${{ env.SOURCE_DIR }}/*.kmx
            ${{ env.SOURCE_DIR }}/*.js
            ${{ env.SOURCE_DIR }}/*.kvk
          if-no-files-found: error
          retention-days: 30
