name: Build K'Cho Keyboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Keyman compiler
        run: npm install --global @keymanapp/kmc
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/KCho-Keyboard-Source-Mun-Chin.zip"
          test -f "$ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/.kcho-source"
          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/.kcho-source"
          PROJECT_DIR="$GITHUB_WORKSPACE/.kcho-source/KCho-Keyboard-Source"
          SOURCE_DIR="$PROJECT_DIR/source"
          BUILD_DIR="$SOURCE_DIR/build"

          # Normalize legacy KPS language metadata for current Keyman compiler.
          SOURCE_DIR="$SOURCE_DIR" python -c 'from pathlib import Path; import os; p=Path(os.environ["SOURCE_DIR"])/"k_cho_keyboard.kps"; s=p.read_text(encoding="utf-8"); old="<Language>"+chr(10)+"          <Name>Mün Chin</Name>"+chr(10)+"          <ID>mwq</ID>"+chr(10)+"        </Language>"; new="<Language ID="+chr(34)+"mwq"+chr(34)+">Mün Chin</Language>"; assert old in s, "legacy language node not found"; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          SOURCE_DIR="$SOURCE_DIR" python -c 'from pathlib import Path; import os; p=Path(os.environ["SOURCE_DIR"])/"k_cho_keyboard.kps"; s=p.read_text(encoding="utf-8"); entry="""    <File>\n      <Name>k_cho_keyboard.bmp</Name>\n      <Description>Keyboard bitmap icon</Description>\n      <CopyLocation>0</CopyLocation>\n      <FileType>.bmp</FileType>\n    </File>\n"""; assert "</Files>" in s; p.write_text(s.replace("</Files>",entry+"</Files>",1),encoding="utf-8")'
          test -f "$SOURCE_DIR/k_cho_keyboard.kmn"
          test -f "$SOURCE_DIR/k_cho_keyboard.kps"
          test -f "$SOURCE_DIR/k_cho_keyboard.bmp"
          mkdir -p "$BUILD_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
      - name: Compile keyboard
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          kmc build k_cho_keyboard.kmn
          for EXT in kmx js kvk; do
            FILE=$(find "$SOURCE_DIR" -maxdepth 3 -type f -name "k_cho_keyboard.$EXT" -not -path '*/build/*' -print -quit)
            if [ -z "$FILE" ]; then
              FILE=$(find "$SOURCE_DIR" -maxdepth 3 -type f -name "k_cho_keyboard.$EXT" -print -quit)
            fi
            if [ -n "$FILE" ]; then cp "$FILE" "$BUILD_DIR/"; fi
          done
          test -f "$BUILD_DIR/k_cho_keyboard.kmx"
          test -f "$BUILD_DIR/k_cho_keyboard.js"
          test -f "$BUILD_DIR/k_cho_keyboard.kvk"
      - name: Build installable KMP
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          kmc build k_cho_keyboard.kps
          KMP_FILE=$(find "$PROJECT_DIR" -type f -name 'k_cho_keyboard.kmp' -print -quit)
          test -n "$KMP_FILE"
          echo "KMP_FILE=$KMP_FILE" >> "$GITHUB_ENV"
          ls -lh "$KMP_FILE"
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: KCho-Keyboard-Installable-KMP
          path: |
            ${{ env.KMP_FILE }}
          if-no-files-found: error
          retention-days: 30
